<!DOCTYPE html>
<html>
<head>
  <title>Google Drive Picker Demo</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
  <h2>Pilih File dari Google Drive</h2>
  <button id="pick-file">Pilih File</button>

  <script>
    const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
    const DEVELOPER_KEY = 'YOUR_DEVELOPER_KEY';
    const SCOPES = ['https://www.googleapis.com/auth/drive.file'];

    let oauthToken;

    document.getElementById('pick-file').addEventListener('click', () => {
      gapi.load('client:auth2', initClient);
    });

    function initClient() {
      gapi.auth2.init({ client_id: CLIENT_ID }).then(() => {
        gapi.auth2.getAuthInstance().signIn({scope: SCOPES.join(' ')}).then(user => {
          oauthToken = user.getAuthResponse().access_token;
          loadPicker();
        }).catch(err => console.error('Login gagal:', err));
      });
    }

    function loadPicker() {
      gapi.load('picker', () => {
        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(true);
        
        const picker = new google.picker.PickerBuilder()
          .addView(view)
          .setOAuthToken(oauthToken)
          .setDeveloperKey(DEVELOPER_KEY)
          .setCallback(pickerCallback)
          .build();
        
        picker.setVisible(true);
      });
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        const file = data.docs[0];
        alert(`File terpilih:\nNama: ${file.name}\nID: ${file.id}`);
      }
    }
  </script>
</body>
</html>
