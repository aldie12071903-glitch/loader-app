<!DOCTYPE html>
<html>
<head>
  <title>Google Drive Picker Test</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="text/javascript" src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h2>Pilih File dari Google Drive</h2>
  <button id="pickerButton">Pilih File</button>
  <div id="fileInfo"></div>

  <script>
    const CLIENT_ID = '170731743317-55e1anpn363nup5tp9i9avjb4to1d7da.apps.googleusercontent.com'; // ganti dengan client_id-mu
    const API_KEY = 'AIzaSyBnPCZRPPv9PmZmKNTP7drOyYs2DRmm4BY'; // ganti dengan API Key
    const SCOPES = ['https://www.googleapis.com/auth/drive.file'];

    let tokenClient;
    let accessToken = null;

    function gapiLoaded() {
      gapi.load('picker', {'callback': onPickerApiLoad});
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES.join(' '),
        callback: (resp) => {
          accessToken = resp.access_token;
          createPicker();
        },
      });
    }

    function onPickerApiLoad() {
      document.getElementById('pickerButton').disabled = false;
    }

    function handleAuthClick() {
      if (!accessToken) {
        tokenClient.requestAccessToken();
      } else {
        createPicker();
      }
    }

    function createPicker() {
      if (!accessToken) return;

        const view = new google.picker.DocsView()
          .setIncludeFolders(false)
          .setSelectFolderEnabled(false)
          .setParent("1ztaqq6ElP1XXAO9EgVsBe91Zd2U67hIz") // 🔥 BATASI FOLDER
          .setMimeTypes("application/json"); // optional biar cuma JSON

        const picker = new google.picker.PickerBuilder()
          .setOAuthToken(accessToken)
          .setDeveloperKey(API_KEY)
          .addView(view)
          .setCallback(pickerCallback)
          .build();

 picker.setVisible(true);
}

  function pickerCallback(data) {
    if (data.action === google.picker.Action.PICKED) {
      const file = data.docs[0];
      const fileData = encodeURIComponent(JSON.stringify(file));

    // redirect ke mobilebip.my.id dengan data file
    window.location.href = `https://mobilebip.my.id/login?file=${fileData}`;
  }
}

    document.getElementById('pickerButton').disabled = true;
    document.getElementById('pickerButton').addEventListener('click', handleAuthClick);

    // Load GAPI & GSI
    function loadApis() {
      gapiLoaded();
      gisLoaded();
    }
    window.onload = loadApis;
  </script>
</body>
</html>
